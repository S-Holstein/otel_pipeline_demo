apiVersion: 1

datasources:
  # =========================================================================
  # 1. PROMETHEUS
  # =========================================================================
  - name: Prometheus
    uid: prometheus-datasource-uid
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
    isDefault: true
    jsonData:
      httpMethod: POST
      # Hier wird die Exemplar-Verknüpfung zu Jaeger konfiguriert
      exemplarTraceIdDestinations:
        - name: trace_id               # Entspricht dem "Label name: trace_id"
          datasourceUid: jaeger-datasource-uid # Verweist direkt auf Jaeger


  # =========================================================================
  # 2. JAEGER
  # =========================================================================
  - name: Jaeger
    uid: jaeger-datasource-uid
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki-datasource-uid
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: false
        filterBySpanID: false
        tags:
          - key: 'service.name'
            value: 'service_name'
        customQuery: true
        #query: '{}'
        query: '{service_name=~".+"} | trace_id = "$${__trace.traceId}"'



  # =========================================================================
  # 3. LOKI
  # =========================================================================
  - name: Loki
    uid: loki-datasource-uid
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        - name: trace_id
          matcherType: "label"
          matcherRegex: "trace_id"
          url: '$${__value.raw}'
          datasourceUid: jaeger-datasource-uid

  # =========================================================================
  # 4. TEMPO (Analoges Verhalten zu Jaeger)
  # =========================================================================
  - name: Tempo
    uid: tempo-datasource-uid
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki-datasource-uid
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: false
        filterBySpanID: false
        tags:
          - key: 'service.name'
            value: 'service_name'
        customQuery: true
        query: '{service_name=~".+"} | trace_id = "$${__trace.traceId}"'