receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318" # Intern im Container aktiv lassen, Port-Mapping im Docker reicht zu löschen

exporters:
  # Aktualisierter Pfad für Prometheus v3 Native OTLP
  otlphttp/prometheus:
    endpoint: "http://prometheus:9090/api/v1/otlp"
    tls:
      insecure: true

  # Exportiert Traces via OTLP gRPC an Jaeger
  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  # Exportiert Traces zusätzlich via OTLP gRPC an Tempo (paralleler Trace-Backend-Vergleich)
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # Exportiert Logs via OTLP HTTP direkt an die native OTLP-Schnittstelle von Loki
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

processors:
  batch:

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/prometheus]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, otlp/tempo] # Traces gehen gleichzeitig an beide Backends

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]