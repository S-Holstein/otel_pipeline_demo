receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"

exporters:
  # Aktualisierter Pfad für Prometheus v3 Native OTLP
  otlphttp/prometheus:
    endpoint: "http://prometheus:9090/api/v1/otlp"
    tls:
      insecure: true


  # Exportiert Traces via OTLP gRPC an Jaeger
  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

processors:
  batch:

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/prometheus] # Angepasst auf OTLP

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
