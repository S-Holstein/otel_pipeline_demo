receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318" # Wichtig für den Legacy Worker

  # Der Prometheus-Receiver für den Legacy-Worker
  prometheus:
    config:
      scrape_configs:
        - job_name: 'legacy-application'
          scrape_interval: 10s
          metrics_path: '/metrics'
          static_configs:
            - targets: ['host.docker.internal:9100']

exporters:
  otlphttp/prometheus:
    endpoint: "http://prometheus:9090/api/v1/otlp"
    tls:
      insecure: true

  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

processors:
  batch:

service:
  pipelines:
    metrics:
      # Hier liest der Collector OTLP-Push UND Prometheus-Pull ein
      receivers: [otlp, prometheus]
      processors: [batch]
      # Der Collector übersetzt die Prometheus-Daten automatisch in OTLP für Prometheus v3
      exporters: [otlphttp/prometheus]

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, otlp/tempo] # Traces gehen gleichzeitig an beide Backends

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
