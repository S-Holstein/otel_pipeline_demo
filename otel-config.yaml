receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "otel"

  # NEU: Exportiert Traces via OTLP gRPC an Jaeger
  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

processors:
  batch:

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]

    # NEU: Aktiviert die Trace-Pipeline
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
