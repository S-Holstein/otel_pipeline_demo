version: '3.8'

services:
  operaton:
    image: operaton/operaton:2.1.2
    ports:
      - "8080:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    volumes:
      - ./otel-config.yaml:/etc/otel-col/config.yaml
    command: ["--config=/etc/otel-col/config.yaml"]
    ports:
      - "4317:4317" # Nimmt Metriken, Traces UND Logs via gRPC an
    depends_on:
      - operaton
      - loki # Wartet, bis Loki bereit ist
    extra_hosts:
      - "host.docker.internal:host-gateway" # Verbindet den Container mit dem WSL-Host

  prometheus:
    image: prom/prometheus:v3.13.1
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-otlp-receiver"
      - "--enable-feature=exemplar-storage"
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # NEU: Loki Service für die Log-Speicherung
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100" # Die OTLP-Schnittstelle von Loki läuft hierüber

  grafana:
    image: grafana/grafana:12.4.5
    ports:
      - "3000:3000"
    volumes:
      # Hier wird die Konfiguration in das richtige Verzeichnis im Container gespiegelt
      - ./grafana-provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Optional: Setzt das Start-Passwort
    depends_on:
      - prometheus
      - loki
      - jaeger

  tempo:
    image: grafana/tempo:2.6.0
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"   # Tempo Query API
      - "4318:4318"   # optional, falls Tempo direkt OTLP/HTTP empfangen soll
    depends_on:
      - otel-collector
