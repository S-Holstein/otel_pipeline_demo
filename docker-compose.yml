version: '3.8'

services:
  operaton:
    image: operaton/operaton:2.1.2
    ports:
      - "8080:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    volumes:
      - ./otel-config.yaml:/etc/otel-col/config.yaml
    command: ["--config=/etc/otel-col/config.yaml"]
    ports:
      - "4317:4317" # Nimmt Metriken, Traces UND Logs via gRPC an
      - "8889:8889"
    depends_on:
      - operaton
      - loki # Wartet, bis Loki bereit ist

  prometheus:
    image: prom/prometheus:v3.13.1
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-otlp-receiver"
      - "--enable-feature=exemplar-storage"
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # NEU: Loki Service für die Log-Speicherung
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100" # Die OTLP-Schnittstelle von Loki läuft hierüber

  grafana:
    image: grafana/grafana:12.4.5
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
      - loki # Grafana verbindet sich auch mit Loki
