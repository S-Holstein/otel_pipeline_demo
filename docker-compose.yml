version: '3.8'

services:
  operaton:
    image: operaton/operaton:2.1.2
    ports:
      - "8080:8080"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    volumes:
      - ./otel-config.yaml:/etc/otel-col/config.yaml
    command: ["--config=/etc/otel-col/config.yaml"]
    ports:
      - "4317:4317" # Nimmt Metriken UND Traces via gRPC an
      - "4318:4318" # Wichtig für HTTP-Push aus Ihrer IDE
      - "8889:8889"
    depends_on:
      - operaton

  prometheus:
    image: prom/prometheus:v3.13.1
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-otlp-receiver"
      - "--enable-feature=exemplar-storage"
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  # NEU: Jaeger für die Visualisierung der Traces
  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "16686:16686" # Die Jaeger Web-Oberfläche für den Browser
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # NEU: Grafana für das gemeinsame Dashboard
  grafana:
    image: grafana/grafana:12.4.5
    ports:
      - "3000:3000" # Die Grafana Web-Oberfläche
    depends_on:
      - prometheus
      - jaeger
