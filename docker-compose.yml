version: '3.8'

services:
  # 1. Die Workflow Engine
  operaton:
    image: operaton/operaton:2.1.2
    ports:
      - "8080:8080"

  # 2. Der OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    volumes:
      - ./otel-config.yaml:/etc/otel-col/config.yaml
    command: ["--config=/etc/otel-col/config.yaml"]
    ports:
      - "4317:4317" # Hierhin sendet Ihr Python-Code später die Daten (gRPC)
      - "8889:8889" # Hier holt Prometheus die Daten ab
    depends_on:
      - operaton

  # 3. Das Monitoring-Dashboard / DB
  prometheus:
    image: prom/prometheus:v3.13.1
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090" # Die Prometheus Web-Oberfläche
    depends_on:
      - otel-collector
