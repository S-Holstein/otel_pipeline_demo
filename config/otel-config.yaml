receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318" # Wichtig für den Legacy Worker

  # Der Prometheus-Receiver für den Legacy-Worker
  prometheus:
    config:
      scrape_configs:
        - job_name: 'legacy-application'
          scrape_interval: 10s
          metrics_path: '/metrics'
          static_configs:
            - targets: ['host.docker.internal:9100']

  # Dedizierter Receiver für die eigenen Collector-Metriken
  prometheus/self:
    config:
      scrape_configs:
        - job_name: 'otel-collector-self'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888'] # Greift die Daten ab, die unten unter service.telemetry definiert sind

exporters:
  otlphttp/prometheus:
    endpoint: "http://prometheus:9090/api/v1/otlp"
    tls:
      insecure: true

  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true

  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

