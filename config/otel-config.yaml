service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888

  pipelines:
    metrics:
      # Hier liest der Collector OTLP-Push UND Prometheus-Pull (sowie eigene Metriken) ein
      receivers: [otlp, prometheus, prometheus/self]
      processors: [batch]
      # Der Collector übersetzt die Prometheus-Daten automatisch in OTLP für Prometheus v3
      exporters: [otlphttp/prometheus]

    traces:
      receivers: [otlp]
#      processors: [tail_sampling, batch]   # <- Reihenfolge wichtig
      processors: [batch]
      exporters: [otlp/jaeger, otlp/tempo] # Traces gehen gleichzeitig an beide Backends

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
